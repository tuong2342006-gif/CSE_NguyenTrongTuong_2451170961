<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Components</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 p-6 space-y-10">

  <section>
    <h2 class="text-xl font-bold mb-4">Buttons</h2>
    <div class="flex flex-wrap gap-4 items-center">

      <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded focus:ring-2 focus:ring-blue-300">
        Primary
      </button>

      <button class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded focus:ring-2 focus:ring-gray-300">
        Secondary
      </button>

      <button class="border border-blue-500 text-blue-500 hover:bg-blue-500 hover:text-white px-4 py-2 rounded focus:ring-2 focus:ring-blue-300">
        Outline
      </button>

      <button disabled class="bg-gray-300 text-gray-500 px-4 py-2 rounded cursor-not-allowed">
        Disabled
      </button>

      <button class="flex items-center gap-2 bg-blue-500 text-white px-4 py-2 rounded">
        <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        Loading
      </button>

      <button class="bg-blue-500 text-white px-2 py-1 text-sm rounded">SM</button>
      <button class="bg-blue-500 text-white px-4 py-2 rounded">MD</button>
      <button class="bg-blue-500 text-white px-6 py-3 text-lg rounded">LG</button>

    </div>
  </section>

  <section>
    <h2 class="text-xl font-bold mb-4">Cards</h2>
    <div class="grid md:grid-cols-3 gap-6">

      <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow hover:shadow-xl transition">
        <img src="https://picsum.photos/200" class="rounded mb-3">
        <h3 class="font-semibold">Product</h3>
        <p class="text-gray-500">$20</p>
      </div>

      <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow hover:shadow-xl transition text-center">
        <img src="https://i.pravatar.cc/100" class="mx-auto rounded-full mb-3">
        <h3 class="font-semibold">John Doe</h3>
        <p class="text-gray-500">Developer</p>
      </div>

      <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow hover:shadow-xl transition text-center">
        <h3 class="text-lg font-bold mb-2">Pro Plan</h3>
        <p class="text-3xl font-bold mb-4">$29</p>
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">
          Buy Now
        </button>
      </div>

    </div>
  </section>

  <section>
    <h2 class="text-xl font-bold mb-4">Forms</h2>
    <div class="space-y-4 max-w-md">

      <div>
        <label class="block mb-1">Name</label>
        <input type="text" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-400">
      </div>

      <div>
        <label class="block mb-1">Category</label>
        <select class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-400">
          <option>Option 1</option>
          <option>Option 2</option>
        </select>
      </div>

      <div>
        <label class="block mb-1">Message</label>
        <textarea class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-400"></textarea>
      </div>

      <div>
        <label class="block mb-1">Options</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-2">
            <input type="checkbox" class="focus:ring-2 focus:ring-blue-400">
            A
          </label>
          <label class="flex items-center gap-2">
            <input type="checkbox" class="focus:ring-2 focus:ring-blue-400">
            B
          </label>
        </div>
      </div>

    </div>
  </section>

  <section>
    <h2 class="text-xl font-bold mb-4">Alerts</h2>
    <div class="space-y-3">

      <div class="flex justify-between items-center bg-green-100 text-green-800 p-3 rounded">
        Success message
        <button class="hover:scale-110">✕</button>
      </div>

      <div class="flex justify-between items-center bg-red-100 text-red-800 p-3 rounded">
        Error message
        <button class="hover:scale-110">✕</button>
      </div>

      <div class="flex justify-between items-center bg-yellow-100 text-yellow-800 p-3 rounded">
        Warning message
        <button class="hover:scale-110">✕</button>
      </div>

      <div class="flex justify-between items-center bg-blue-100 text-blue-800 p-3 rounded">
        Info message
        <button class="hover:scale-110">✕</button>
      </div>

    </div>
  </section>

  <section>
    <h2 class="text-xl font-bold mb-4">Navigation</h2>

    <nav class="flex justify-between items-center bg-white dark:bg-gray-800 p-4 rounded shadow mb-4">
      <h3 class="font-bold">Logo</h3>
      <div class="hidden md:flex gap-4">
        <a href="#" class="hover:text-blue-500">Home</a>
        <a href="#" class="hover:text-blue-500">About</a>
      </div>
    </nav>

    <div class="flex">
      <aside class="w-48 bg-white dark:bg-gray-800 p-4 rounded shadow space-y-2">
        <a href="#" class="block hover:bg-gray-200 dark:hover:bg-gray-700 p-2 rounded">Dashboard</a>
        <a href="#" class="block hover:bg-gray-200 dark:hover:bg-gray-700 p-2 rounded">Users</a>
      </aside>

      <div class="flex-1 p-4">
        Content area
      </div>
    </div>

  </section>

</body>
</html>
