<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Landing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-200">

  <nav class="flex justify-between items-center p-4 shadow-md dark:bg-gray-800">
    <h1 class="text-xl font-bold">MyBrand</h1>

    <ul class="hidden md:flex gap-6">
      <li><a href="#" class="hover:text-blue-500">Home</a></li>
      <li><a href="#" class="hover:text-blue-500">Products</a></li>
      <li><a href="#" class="hover:text-blue-500">About</a></li>
    </ul>

    <button class="md:hidden text-2xl">☰</button>
  </nav>

  <section class="w-full h-[80vh] bg-cover bg-center flex items-center justify-center text-center
                  bg-[url('https://picsum.photos/1600/900')]">
    <div class="bg-black/50 p-8 rounded-lg">
      <h2 class="text-4xl md:text-5xl font-bold text-white mb-4">
        Welcome to Our Store
      </h2>
      <p class="text-gray-200 mb-6">
        Best products with best prices
      </p>
      <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg transition">
        Shop Now
      </button>
    </div>
  </section>
  <section class="p-8">
    <h2 class="text-2xl font-bold mb-6 text-center">Products</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

      <div class="rounded-lg shadow-md hover:shadow-xl transition-shadow p-4 dark:bg-gray-800">
        <img src="https://picsum.photos/300" class="rounded-lg mb-4" />
        <h3 class="font-semibold text-lg">Product 1</h3>
        <p class="text-gray-500 dark:text-gray-400">$20</p>
      </div>

      <div class="rounded-lg shadow-md hover:shadow-xl transition-shadow p-4 dark:bg-gray-800">
        <img src="https://picsum.photos/301" class="rounded-lg mb-4" />
        <h3 class="font-semibold text-lg">Product 2</h3>
        <p class="text-gray-500 dark:text-gray-400">$25</p>
      </div>

      <div class="rounded-lg shadow-md hover:shadow-xl transition-shadow p-4 dark:bg-gray-800">
        <img src="https://picsum.photos/302" class="rounded-lg mb-4" />
        <h3 class="font-semibold text-lg">Product 3</h3>
        <p class="text-gray-500 dark:text-gray-400">$30</p>
      </div>

      <div class="rounded-lg shadow-md hover:shadow-xl transition-shadow p-4 dark:bg-gray-800">
        <img src="https://picsum.photos/303" class="rounded-lg mb-4" />
        <h3 class="font-semibold text-lg">Product 4</h3>
        <p class="text-gray-500 dark:text-gray-400">$35</p>
      </div>

    </div>
  </section>

  <footer class="bg-gray-100 dark:bg-gray-800 p-8">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center md:text-left">

      <div>
        <h3 class="font-bold mb-2">Company</h3>
        <p>About us</p>
        <p>Careers</p>
      </div>

      <div>
        <h3 class="font-bold mb-2">Support</h3>
        <p>Help Center</p>
        <p>Contact</p>
      </div>

      <div>
        <h3 class="font-bold mb-2">Follow</h3>
        <p>Facebook</p>
        <p>Instagram</p>
      </div>

    </div>

    <p class="text-center mt-6 text-sm text-gray-500 dark:text-gray-400">
      © 2026 MyBrand. All rights reserved.
    </p>
  </footer>

</body>
</html>
