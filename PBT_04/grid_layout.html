<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Grid Layout E-Commerce</title>

  <link rel="stylesheet" href="grid.css">
</head>

<body>

  <div class="layout">

    <header class="header">
      <h1>MyShop</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="hero">

      <div class="hero-content">
        <h2>MEGA SALE 50%</h2>

        <p>
          Khuyến mãi cực lớn cho toàn bộ sản phẩm.
        </p>

        <button>Mua ngay</button>
      </div>

    </section>

    <aside class="sidebar">

      <h3>Bộ lọc</h3>

      <label>
        <input type="checkbox">
        Điện tử
      </label>

      <label>
        <input type="checkbox">
        Thời trang
      </label>

      <label>
        <input type="checkbox">
        Gaming
      </label>

      <label>
        <input type="checkbox">
        Phụ kiện
      </label>

      <label>
        <input type="checkbox">
        Giá dưới 1 triệu
      </label>

    </aside>

    <main class="main-content">

      <!-- FEATURED CARD -->
      <div class="product-card featured">

        <img 
          src="https://picsum.photos/600/300?random=1"
          alt="Product"
        >

        <div class="card-content">
          <h3>Sản phẩm nổi bật</h3>

          <p class="price">2.999.000đ</p>

          <button>Mua ngay</button>
        </div>

      </div>

      <div class="product-card">

        <img 
          src="https://picsum.photos/300/200?random=2"
          alt="Product"
        >

        <div class="card-content">
          <h3>Tai nghe Bluetooth</h3>

          <p class="price">599.000đ</p>

          <button>Mua</button>
        </div>

      </div>

      <div class="product-card">

        <img 
          src="https://picsum.photos/300/200?random=3"
          alt="Product"
        >

        <div class="card-content">
          <h3>Bàn phím cơ</h3>

          <p class="price">1.299.000đ</p>

          <button>Mua</button>
        </div>

      </div>

      <div class="product-card">

        <img 
          src="https://picsum.photos/300/200?random=4"
          alt="Product"
        >

        <div class="card-content">
          <h3>Chuột gaming</h3>

          <p class="price">499.000đ</p>

          <button>Mua</button>
        </div>

      </div>

      <div class="product-card">

        <img 
          src="https://picsum.photos/300/200?random=5"
          alt="Product"
        >

        <div class="card-content">
          <h3>Camera mini</h3>

          <p class="price">899.000đ</p>

          <button>Mua</button>
        </div>

      </div>

      <div class="product-card">

        <img 
          src="https://picsum.photos/300/200?random=6"
          alt="Product"
        >

        <div class="card-content">
          <h3>Loa Bluetooth</h3>

          <p class="price">699.000đ</p>

          <button>Mua</button>
        </div>

      </div>

    </main>
    
    <aside class="ads">

      <h3>Quảng cáo</h3>

      <img 
        src="https://picsum.photos/200/500?random=10"
        alt="Ads"
      >

    </aside>

    <footer class="footer">

      <p>
        © 2026 MyShop - All Rights Reserved
      </p>

    </footer>

  </div>

</body>
</html>
